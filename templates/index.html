{% extends "base.html" %}
{% block title %}Measure a flower — Iris classifier{% endblock %}

{% block content %}
<section class="card">

  <div class="card-head">
    <h1>What species is it?</h1>
    <p class="lead">Enter four measurements in centimeters and the model will guess the iris species.</p>
  </div>

  <!--
    ENGINEERING TIP: the diagram below
    ---------------------------------
    A very common beginner mix-up with the iris dataset is not knowing
    which physical part is the "sepal" and which is the "petal" -- they
    look similar in a plain table of numbers. A small labeled diagram
    here removes that ambiguity before the user even touches the form.
    This is "grounding the UI in the subject matter": the form isn't
    just generic inputs, it explains the flower it's measuring.
  -->
  <figure class="flower-legend" aria-hidden="false">
    <svg viewBox="0 0 240 170" role="img" aria-label="Diagram of an iris flower showing three outer sepals and three inner petals">
      <g stroke="#3F7A5C" stroke-width="1.6" fill="rgba(63,122,92,0.08)">
        <g transform="rotate(0 120 95)"><ellipse cx="120" cy="48" rx="20" ry="46"/></g>
        <g transform="rotate(120 120 95)"><ellipse cx="120" cy="48" rx="20" ry="46"/></g>
        <g transform="rotate(240 120 95)"><ellipse cx="120" cy="48" rx="20" ry="46"/></g>
      </g>
      <g stroke="#6C4BA6" stroke-width="1.6" fill="rgba(108,75,166,0.12)">
        <g transform="rotate(60 120 95)"><ellipse cx="120" cy="62" rx="12" ry="30"/></g>
        <g transform="rotate(180 120 95)"><ellipse cx="120" cy="62" rx="12" ry="30"/></g>
        <g transform="rotate(300 120 95)"><ellipse cx="120" cy="62" rx="12" ry="30"/></g>
      </g>
      <circle cx="120" cy="95" r="6" fill="#F5F6F1" stroke="#2A362F" stroke-width="1.2"/>
    </svg>
    <figcaption class="legend-key">
      <span><i class="swatch swatch-sepal"></i>Sepals — the three larger, outer parts</span>
      <span><i class="swatch swatch-petal"></i>Petals — the three smaller, inner parts</span>
    </figcaption>
  </figure>

  <!--
    ENGINEERING TIP: field names must match app.py exactly
    ---------------------------------
    Flask reads these with request.form['Sepal length'], etc. The "name"
    attribute below is the contract between this HTML and your Python
    code -- if they don't match character-for-character (including
    capitalization and spaces), request.form['...'] will raise a
    KeyError. Your /predict route already wraps this in try/except, so
    a mismatch would currently show as a flashed error rather than crash
    the app, which is good defensive practice.
  -->
  <form class="measure-form" method="post" action="{{ url_for('make_prediction') }}" novalidate>

    <fieldset>
      <legend><span class="swatch swatch-sepal"></span>Sepal</legend>
      <div class="field-row">
        <div class="field">
          <label for="sepal_length">Length</label>
          <div class="input-unit">
            <input type="number" step="0.1" min="0" max="15" required
                   id="sepal_length" name="Sepal_length" placeholder="5.1">
            <span class="unit">cm</span>
          </div>
        </div>
        <div class="field">
          <label for="sepal_width">Width</label>
          <div class="input-unit">
            <input type="number" step="0.1" min="0" max="15" required
                   id="sepal_width" name="Sepal_width" placeholder="3.5">
            <span class="unit">cm</span>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="swatch swatch-petal"></span>Petal</legend>
      <div class="field-row">
        <div class="field">
          <label for="petal_length">Length</label>
          <div class="input-unit">
            <input type="number" step="0.1" min="0" max="15" required
                   id="petal_length" name="Petal_length" placeholder="1.4">
            <span class="unit">cm</span>
          </div>
        </div>
        <div class="field">
          <label for="petal_width">Width</label>
          <div class="input-unit">
            <input type="number" step="0.1" min="0" max="15" required
                   id="petal_width" name="Petal_width" placeholder="0.2">
            <span class="unit">cm</span>
          </div>
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn btn-primary">Predict species</button>
  </form>
</section>
{% endblock %}
